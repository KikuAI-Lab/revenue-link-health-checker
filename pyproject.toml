[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-link-health"
version = "0.1.0"
description = "Local-first revenue-link repair pack, document patching, and dropzone workflow"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"

[project.scripts]
linkhealth = "linkhealth.cli:main"
